[project]
name = "cw-reports-mcp"
version = "0.1.0"
description = "Reports-first MCP server for ConnectWise: pre-built rpt reports, raw SQL only as a last resort"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4",
    "mcp>=1.9,<2",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
cw-reports-mcp = "cw_reports_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cw_reports_mcp"]
